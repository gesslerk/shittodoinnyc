name: Weekly email

on:
  schedule:
    # GitHub cron is UTC and best-effort: it fired six hours late on the first Monday.
    # So: a slot every 30 minutes from 10:00 to 14:30 UTC on Mondays (6:00 to 10:30am
    # New York in summer, 5:00 to 9:30am in winter). The first slot GitHub actually runs
    # sends the email; every later slot finds this week's issue in archive/ and skips.
    - cron: "0,30 10-14 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the email but do not send it (download it from the run's artifacts)"
        type: boolean
        default: false
      lanes:
        description: "Comma-separated subset of research lanes (blank = all)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: weekly-email
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Sync to the latest main
        # A slot that queued behind an earlier one checked out an older commit; pull so
        # the gate sees the archive that run just committed.
        run: git pull --ff-only origin ${{ github.ref_name }} || true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build and send
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
          CURATE_MODEL: ${{ vars.CURATE_MODEL }}
          VERIFY_MODEL: ${{ vars.VERIFY_MODEL }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          LANES: ${{ github.event.inputs.lanes }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: node src/index.js

      - name: Upload the built email
        if: always() && steps.run.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: email-${{ steps.run.outputs.week_of }}
          path: out/
          retention-days: 30

      - name: Commit the archive
        if: steps.run.outputs.sent == 'true'
        run: |
          git config user.name "shittodoinnyc-bot"
          git config user.email "shittodoinnyc-bot@users.noreply.github.com"
          git add archive
          git commit -m "archive: ${{ steps.run.outputs.week_of }}" || { echo "nothing to commit"; exit 0; }
          git pull --rebase origin ${{ github.ref_name }}
          git push
